
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>E-Commerce Store</h1>
        <p>Explore Our Products</p>
    </header>

    <main>
        <input type="text" id="searchInput"
               placeholder="Search products...">
               <select id="categoryFilter">
    <option value="all">All Categories</option>
</select>
        
<div class="stats-container">
    <div class="stat-card">
        <h3>Total Products</h3>
        <p id="totalProducts">0</p>
    </div>

    <div class="stat-card">
        <h3>Average Price</h3>
        <p id="averagePrice">$0</p>
    </div>

    <div class="stat-card">
        <h3>Average Rating</h3>
        <p id="averageRating">0</p>
    </div>
</div>
<div class="download-section">
    <a href="/download-csv" class="download-btn">
        Download Products CSV
    </a>
</div>
<!-- EDA Charts Section -->
<section class="charts-section">
    <h2>Data Analysis Dashboard</h2>

    <div class="charts-container">
        <div class="chart-card">
            <h3>Products by Category</h3>
            <img src="/reports/category_chart.png" alt="Category Chart">
        </div>

        <div class="chart-card">
            <h3>Product Price Distribution</h3>
            <img src="/reports/price_chart.png" alt="Price Chart">
        </div>

        <div class="chart-card">
            <h3>Product Rating Distribution</h3>
            <img src="/reports/rating_chart.png" alt="Rating Chart">
        </div>
    </div>
</section>

       

        <div id="productContainer"></div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
